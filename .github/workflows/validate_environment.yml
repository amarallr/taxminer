name: validate_environment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: false
      # renv reports false cycles (magrittr <-> testthat, curl <-> qpdf <->
      # pdftools) when locked versions without a Windows binary are built from
      # source; install them from their locked tarballs before the restore.
      - name: Preinstall locked source-only packages
        run: Rscript scripts/ci_preinstall_locked.R
      - name: Restore locked dependencies
        run: Rscript -e "renv::restore(prompt = FALSE)"
      - name: Validate environment
        run: Rscript --vanilla scripts/validate_environment.R
